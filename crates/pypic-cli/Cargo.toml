[package]
name = "pypic-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pypic"
path = "src/main.rs"

[dependencies]
pypic-frontend = { path = "../pypic-frontend" }
pypic-ir = { path = "../pypic-ir" }
pypic-device = { path = "../pypic-device" }
pypic-pic14 = { path = "../pypic-pic14" }
toml = "1"
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
serialport = { version = "4.10", default-features = false }
regex = "1"
